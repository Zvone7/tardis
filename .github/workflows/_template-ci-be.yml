name: '[BE] CI Template'

on:
  workflow_call:
    inputs:
      buildNumber:
        required: false
        type: string
        default: 'latest'
      envCode:
        required: false
        type: string
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.envCode }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Compute content hash
      id: content-hash
      run: |
        CONFIG=$(cat .github/config/project-config.json)

        PATHS=$(echo "$CONFIG" | jq -r '.services[] | select(.name == "tripplanner/be") | .paths[]')

        ALL_HASH=$(git ls-tree -r HEAD | while IFS= read -r line; do
          FILE=$(echo "$line" | awk '{print $4}')
          while IFS= read -r PATTERN; do
            if echo "$FILE" | grep -qE "$PATTERN"; then
              echo "$line"
              break
            fi
          done <<< "$PATHS"
        done | sha256sum | cut -d' ' -f1)

        echo "hash=${ALL_HASH:0:12}" >> $GITHUB_OUTPUT
        echo "Content hash: ${ALL_HASH:0:12}"

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }

    - name: Log in to ACR
      run: |
        az acr login --name ${{ vars.ACR_NAME }}

    - name: Set Build Number
      id: build_number
      run: |
        DATE=$(date +%Y%m%d)
        echo "BUILD_NUMBER=${DATE}.${{ inputs.buildNumber }}" >> $GITHUB_ENV

    - name: Check if image already exists in ACR
      id: check-image
      run: |
        IMAGE="${{ vars.ACR_NAME }}.azurecr.io/tripplanner/be"
        CONTENT_TAG="content-${{ steps.content-hash.outputs.hash }}"

        if docker manifest inspect "${IMAGE}:${CONTENT_TAG}" > /dev/null 2>&1; then
          echo "Image already exists for content hash ${CONTENT_TAG}, skipping build"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "No existing image found for content hash ${CONTENT_TAG}, will build"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Re-tag existing image
      if: ${{ steps.check-image.outputs.exists == 'true' }}
      run: |
        IMAGE="${{ vars.ACR_NAME }}.azurecr.io/tripplanner/be"
        CONTENT_TAG="content-${{ steps.content-hash.outputs.hash }}"

        docker pull "${IMAGE}:${CONTENT_TAG}"
        docker tag "${IMAGE}:${CONTENT_TAG}" "${IMAGE}:$BUILD_NUMBER"
        docker push "${IMAGE}:$BUILD_NUMBER"
        docker tag "${IMAGE}:${CONTENT_TAG}" "${IMAGE}:latest"
        docker push "${IMAGE}:latest"

    - name: Build and Push Backend Docker Image
      if: ${{ steps.check-image.outputs.exists != 'true' }}
      run: |
        IMAGE="${{ vars.ACR_NAME }}.azurecr.io/tripplanner/be"
        CONTENT_TAG="content-${{ steps.content-hash.outputs.hash }}"

        docker build -t ${IMAGE}:latest \
                      -t ${IMAGE}:$BUILD_NUMBER \
                      --build-arg BUILD_NUMBER=$BUILD_NUMBER\
                      --build-arg ENV_CODE=${{ inputs.envCode }} \
                      -f projects/tripplanner/Dockerfile.be projects/tripplanner

        docker push ${IMAGE}:$BUILD_NUMBER
        docker push ${IMAGE}:latest
        docker tag ${IMAGE}:$BUILD_NUMBER ${IMAGE}:${CONTENT_TAG}
        docker push ${IMAGE}:${CONTENT_TAG}
