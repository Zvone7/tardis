name: '[BE][dev] Build and Deploy Workflow'

on:
  push:
    branches:
      - dev/tripplanner/be
      - feature/**
    paths:
      - 'projects/tripplanner/backend/**'
  workflow_dispatch:
    inputs:
      buildNumber:
        description: 'Build number to deploy (e.g., latest or a specific tag). Default is GitHub build number. '
        required: false
        default: 'latest'
      envCode:
        description: 'Deployment environment (dev, prod)'
        required: false
        default: 'dev'

jobs:
  ci:
    name: Build
    uses: ./.github/workflows/_template-ci-be.yml
    with:
      buildNumber: ${{ github.event.inputs.buildNumber || github.run_number || 'latest' }}
      envCode: ${{ github.event.inputs.envCode || 'dev' }}
    secrets: inherit

  cd:
    name: Deploy
    needs: ci
    uses: ./.github/workflows/_template-cd-be.yml
    with:
      buildNumber: ${{ github.event.inputs.buildNumber || github.run_number || 'latest' }}
      envCode: ${{ github.event.inputs.envCode || 'dev' }}
    secrets: inherit
