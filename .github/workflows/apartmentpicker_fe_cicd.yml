name: '[AP][FE] Build and Deploy'

on:
  push:
    branches:
      - dev/apartmentpicker/fe
      - ap/feature/**
    paths:
      - 'projects/apartmentpicker/frontend/**'
  workflow_dispatch:
    inputs:
      buildNumber:
        description: 'Build number (default: GitHub run number)'
        required: false
        default: 'latest'
      envCode:
        description: 'Deployment environment (dev, prod)'
        required: false
        default: 'dev'

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.envCode || 'dev' }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Compute content hash
      id: content-hash
      run: |
        CONFIG=$(cat .github/config/project-config.json)

        PATHS=$(echo "$CONFIG" | jq -r '.services[] | select(.name == "apartmentpicker/fe") | .paths[]')

        ALL_HASH=$(git ls-tree -r HEAD | while IFS= read -r line; do
          FILE=$(echo "$line" | awk '{print $4}')
          while IFS= read -r PATTERN; do
            if echo "$FILE" | grep -qE "$PATTERN"; then
              echo "$line"
              break
            fi
          done <<< "$PATHS"
        done | sha256sum | cut -d' ' -f1)

        echo "hash=${ALL_HASH:0:12}" >> $GITHUB_OUTPUT
        echo "Content hash: ${ALL_HASH:0:12}"

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }

    - name: Log in to ACR
      run: az acr login --name ${{ vars.ACR_NAME }}

    - name: Set Build Number
      run: |
        DATE=$(date +%Y%m%d)
        echo "BUILD_NUMBER=${DATE}.${{ github.event.inputs.buildNumber || github.run_number || 'latest' }}" >> $GITHUB_ENV

    - name: Check if image already exists in ACR
      id: check-image
      run: |
        IMAGE="${{ vars.ACR_NAME }}.azurecr.io/apartmentpicker/fe"
        CONTENT_TAG="content-${{ steps.content-hash.outputs.hash }}"

        if docker manifest inspect "${IMAGE}:${CONTENT_TAG}" > /dev/null 2>&1; then
          echo "Image already exists for content hash ${CONTENT_TAG}, skipping build"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "No existing image found for content hash ${CONTENT_TAG}, will build"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Re-tag existing image
      if: ${{ steps.check-image.outputs.exists == 'true' }}
      run: |
        IMAGE="${{ vars.ACR_NAME }}.azurecr.io/apartmentpicker/fe"
        CONTENT_TAG="content-${{ steps.content-hash.outputs.hash }}"

        docker pull "${IMAGE}:${CONTENT_TAG}"
        docker tag "${IMAGE}:${CONTENT_TAG}" "${IMAGE}:$BUILD_NUMBER"
        docker push "${IMAGE}:$BUILD_NUMBER"
        docker tag "${IMAGE}:${CONTENT_TAG}" "${IMAGE}:latest"
        docker push "${IMAGE}:latest"

    - name: Build and Push Frontend Docker Image
      if: ${{ steps.check-image.outputs.exists != 'true' }}
      run: |
        IMAGE="${{ vars.ACR_NAME }}.azurecr.io/apartmentpicker/fe"
        CONTENT_TAG="content-${{ steps.content-hash.outputs.hash }}"

        docker build -t ${IMAGE}:latest \
                      -t ${IMAGE}:$BUILD_NUMBER \
                      --build-arg NEXT_PUBLIC_BUILD_NUMBER=$BUILD_NUMBER \
                      --build-arg NEXT_PUBLIC_ENV_CODE=${{ github.event.inputs.envCode || 'dev' }} \
                      --build-arg NEXT_PUBLIC_BACKEND_ROOT_URL=${{ vars.NEXT_PUBLIC_AP_BACKEND_ROOT_URL }} \
                      --build-arg NEXT_PUBLIC_FRONTEND_ROOT_URL=${{ vars.NEXT_PUBLIC_AP_FRONTEND_ROOT_URL }} \
                      -f projects/apartmentpicker/Dockerfile.fe projects/apartmentpicker

        docker push ${IMAGE}:$BUILD_NUMBER
        docker push ${IMAGE}:latest
        docker tag ${IMAGE}:$BUILD_NUMBER ${IMAGE}:${CONTENT_TAG}
        docker push ${IMAGE}:${CONTENT_TAG}

  cd:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.envCode || 'dev' }}
    steps:
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }

    - name: Log in to ACR
      run: az acr login --name ${{ vars.ACR_NAME }}

    - name: Set Build Number
      run: |
        DATE=$(date +%Y%m%d)
        echo "BUILD_NUMBER=${DATE}.${{ github.event.inputs.buildNumber || github.run_number || 'latest' }}" >> $GITHUB_ENV

    - name: Deploy to Azure Web App
      run: |
        az webapp config container set \
          --name ${{ vars.WEB_APP_AP_FE_NAME }} \
          --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
          --container-image-name ${{ vars.ACR_NAME }}.azurecr.io/apartmentpicker/fe:$BUILD_NUMBER \
          --container-registry-url https://${{ vars.ACR_NAME }}.azurecr.io

    - name: Restart Azure Web App
      run: |
        az webapp restart --name ${{ vars.WEB_APP_AP_FE_NAME }} \
          --resource-group ${{ secrets.RESOURCE_GROUP_NAME }}
