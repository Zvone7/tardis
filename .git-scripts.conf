# .git-scripts.conf - Git scripts configuration for TripPlanner monorepo
# Sourced by scripts in C:/repos/scripts-bat/git/

# Branch prefix (empty = no prefix)
BRANCH_PREFIX=""

# Project codes (space-separated)
PROJECT_CODES="TP AP"

# For each code: NAME, DIR, WS (workspace file), SLN (solution file)

PROJECT_TP_NAME="TripPlanner"
PROJECT_TP_DIR="projects/tripplanner"
PROJECT_TP_WS="projects/tripplanner/tripplanner.code-workspace"
PROJECT_TP_SLN="projects/tripplanner/backend/TripPlanner/TripPlanner.sln"

PROJECT_AP_NAME="ApartmentPicker"
PROJECT_AP_DIR="projects/apartmentpicker"
PROJECT_AP_WS="projects/apartmentpicker/apartmentpicker.code-workspace"
PROJECT_AP_SLN="projects/apartmentpicker/backend/ApartmentPicker/ApartmentPicker.sln"
